<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلة رَوق | RAWQ</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--dark:#21130f;
--cream:#f5eadb;
--paper:#fffaf3;
--orange:#d86f45;
--gold:#e5aa68;
--muted:#8b7569;
}

body{
font-family:Arial,sans-serif;
background:var(--paper);
color:var(--dark);
padding-bottom:130px;
}

header{
padding:24px 20px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:28px;
font-weight:900;
}

.back{
text-decoration:none;
color:var(--dark);
border:1px solid #e0d0c2;
padding:10px 14px;
border-radius:30px;
}

.hero{
padding:25px 20px 30px;
}

.hero small{
color:var(--orange);
font-weight:bold;
}

.hero h1{
font-size:48px;
margin-top:7px;
}

.hero p{
color:var(--muted);
margin-top:9px;
line-height:1.7;
}

.cart-list{
padding:0 18px;
}

.item{
background:white;
border-radius:24px;
padding:12px;
margin-bottom:14px;
display:grid;
grid-template-columns:105px 1fr;
gap:14px;
box-shadow:0 8px 25px rgba(40,20,10,.06);
}

.item img{
width:105px;
height:130px;
object-fit:cover;
border-radius:17px;
}

.item h3{
font-size:18px;
margin:5px 0 7px;
}

.details{
color:var(--muted);
font-size:11px;
line-height:1.7;
}

.item-bottom{
display:flex;
align-items:center;
justify-content:space-between;
margin-top:10px;
}

.price{
font-weight:900;
}

.controls{
display:flex;
align-items:center;
gap:9px;
}

.controls button{
width:30px;
height:30px;
border:0;
border-radius:50%;
background:var(--dark);
color:white;
font-size:17px;
}

.delete{
border:0;
background:none;
color:#b14f39;
font-size:11px;
margin-top:9px;
cursor:pointer;
}

.empty{
text-align:center;
padding:65px 25px;
}

.empty .cup{
font-size:55px;
margin-bottom:15px;
}

.empty h2{
font-size:25px;
}

.empty p{
color:var(--muted);
margin:10px 0 25px;
}

.empty a{
display:inline-block;
background:var(--dark);
color:white;
padding:14px 24px;
border-radius:30px;
text-decoration:none;
}

.summary{
margin:30px 18px;
background:#f1dfcb;
border-radius:23px;
padding:20px;
}

.row{
display:flex;
justify-content:space-between;
margin-bottom:12px;
font-size:13px;
}

.total-row{
border-top:1px solid #d7c0aa;
padding-top:15px;
margin-top:5px;
font-size:20px;
font-weight:900;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
padding:14px 18px 22px;
background:rgba(255,250,243,.96);
backdrop-filter:blur(10px);
border-top:1px solid #eadccf;
}

.checkout{
display:flex;
justify-content:space-between;
align-items:center;
max-width:650px;
margin:auto;
background:var(--dark);
color:white;
text-decoration:none;
border-radius:18px;
padding:18px;
font-weight:bold;
}

.checkout span:last-child{
color:var(--gold);
}

@media(min-width:700px){
body{
max-width:700px;
margin:auto;
}

.bottom{
max-width:700px;
margin:auto;
}
}
</style>
</head>

<body>

<header>
<div class="logo">رَوق</div>
<a href="menu.html" class="back">+ أضف أكثر</a>
</header>

<section class="hero">
<small>YOUR ORDER / 03</small>
<h1>طلبك.</h1>
<p>راجع روقانك قبل ما نكمل بيانات الطلب.</p>
</section>

<div id="cartList" class="cart-list"></div>

<div id="summary" class="summary" style="display:none">

<div class="row">
<span>المجموع</span>
<span id="subtotal">0.000 ر.ع</span>
</div>

<div class="row">
<span>رسوم التوصيل</span>
<span>تُحدد لاحقًا</span>
</div>

<div class="row total-row">
<span>الإجمالي الحالي</span>
<span id="grandTotal">0.000 ر.ع</span>
</div>

</div>

<div class="bottom" id="bottomBar" style="display:none">
<a href="checkout.html" class="checkout">
<span>إتمام الطلب ←</span>
<span id="buttonTotal">0.000 ر.ع</span>
</a>
</div>

<script>

let cart = JSON.parse(localStorage.getItem("rawqCart")) || [];

function save(){
localStorage.setItem("rawqCart", JSON.stringify(cart));
render();
}

function render(){

const list = document.getElementById("cartList");
const summary = document.getElementById("summary");
const bottom = document.getElementById("bottomBar");

list.innerHTML = "";

if(cart.length === 0){

summary.style.display = "none";
bottom.style.display = "none";

list.innerHTML = `
<div class="empty">
<div class="cup">☕</div>
<h2>السلة فاضية</h2>
<p>واضح إن روقانك للحين ما اكتمل.</p>
<a href="menu.html">استكشف المنيو</a>
</div>
`;

return;
}

summary.style.display = "block";
bottom.style.display = "block";

let total = 0;

cart.forEach((item,index)=>{

total += Number(item.total);

let extrasText =
item.extras && item.extras.length
? item.extras.join(" • ")
: "بدون إضافات";

list.innerHTML += `
<div class="item">

<img src="${item.image}" alt="${item.name}">

<div>
<h3>${item.name}</h3>

<div class="details">
الحجم: ${item.size}<br>
الحليب: ${item.milk}<br>
${extrasText}
</div>

<div class="item-bottom">

<div class="price">
${Number(item.total).toFixed(3)} ر.ع
</div>

<div class="controls">
<button onclick="changeQty(${index},-1)">−</button>
<span>${item.quantity}</span>
<button onclick="changeQty(${index},1)">+</button>
</div>

</div>

<button class="delete" onclick="removeItem(${index})">
حذف من الطلب
</button>

</div>

</div>
`;
});

document.getElementById("subtotal").textContent =
total.toFixed(3) + " ر.ع";

document.getElementById("grandTotal").textContent =
total.toFixed(3) + " ر.ع";

document.getElementById("buttonTotal").textContent =
total.toFixed(3) + " ر.ع";
}

function changeQty(index,change){

const item = cart[index];

const oldQty = item.quantity;
const singlePrice = item.total / oldQty;

item.quantity += change;

if(item.quantity < 1){
item.quantity = 1;
}

item.total = singlePrice * item.quantity;

save();
}

function removeItem(index){

cart.splice(index,1);
save();
}

render();

</script>
<!-- RAWQ CART AUTO DEMO -->
<style>
#cartDemoLayer{
position:fixed;
inset:0;
z-index:99999;
pointer-events:none;
display:none;
}

.cart-demo-text{
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%) translateY(15px);
background:rgba(33,19,15,.96);
color:#fffaf3;
padding:13px 22px;
border-radius:100px;
font-size:13px;
font-weight:800;
white-space:nowrap;
opacity:0;
transition:.3s ease;
box-shadow:0 10px 30px rgba(0,0,0,.20);
}

.cart-demo-text.show{
opacity:1;
transform:translateX(-50%) translateY(0);
}

.cart-demo-pointer{
position:fixed;
width:42px;
height:42px;
border-radius:50%;
background:#d86f45;
border:4px solid white;
box-shadow:0 8px 25px rgba(0,0,0,.25);
opacity:0;
transform:scale(.5);
transition:
left .6s ease,
top .6s ease,
opacity .25s,
transform .18s;
}

.cart-demo-pointer.show{
opacity:1;
transform:scale(1);
}

.cart-demo-pointer.click{
transform:scale(.68);
}

.cart-demo-pointer::after{
content:"";
position:absolute;
inset:-9px;
border:2px solid rgba(216,111,69,.45);
border-radius:50%;
animation:cartPulse 1s infinite;
}

@keyframes cartPulse{
from{
transform:scale(.7);
opacity:1;
}

to{
transform:scale(1.5);
opacity:0;
}
}
</style>


<div id="cartDemoLayer">

<div
class="cart-demo-pointer"
id="cartDemoPointer">
</div>

<div
class="cart-demo-text"
id="cartDemoText">
</div>

</div>


<script>
(function(){

const params =
new URLSearchParams(window.location.search);

if(params.get("demo") !== "1") return;


const layer =
document.getElementById("cartDemoLayer");

const pointer =
document.getElementById("cartDemoPointer");

const text =
document.getElementById("cartDemoText");

layer.style.display="block";


function wait(ms){
return new Promise(resolve =>
setTimeout(resolve,ms)
);
}


function say(message){

text.textContent=message;
text.classList.add("show");

}


function pointTo(element){

if(!element) return;

element.scrollIntoView({
behavior:"smooth",
block:"center"
});

setTimeout(()=>{

const r =
element.getBoundingClientRect();

pointer.style.left =
(r.left+r.width/2-21)+"px";

pointer.style.top =
(r.top+r.height/2-21)+"px";

pointer.classList.add("show");

},400);

}


async function clickEffect(){

pointer.classList.add("click");

await wait(180);

pointer.classList.remove("click");

}


async function run(){

await wait(600);


/* الطلب */

say("راجع طلبك قبل الإكمال");

const orderItem =
document.querySelector(".cart-item") ||
document.querySelector(".item") ||
document.querySelector(
"#cartItems > *"
);

if(orderItem){
pointTo(orderItem);
}

await wait(1300);


/* الإجمالي */

say("وتأكد من الإجمالي");

const total =
document.getElementById("total") ||
document.querySelector(".total");

if(total){
pointTo(total);
}

await wait(1100);


/* إتمام الطلب */

say("كل شيء تمام؟ أكمل طلبك");

const links =
[...document.querySelectorAll("a")];

let checkout =
links.find(link =>
link.getAttribute("href") &&
link.getAttribute("href")
.toLowerCase()
.includes("checkout")
);


if(checkout){

pointTo(checkout);

await wait(1000);

await clickEffect();

}


/*
الانتقال مع استمرار
وضع العرض التلقائي
*/

window.location.href =
"checkout.html?demo=1";

}


run();

})();
</script>
</body>
</html>
