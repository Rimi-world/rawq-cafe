<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلة رَوق | RAWQ</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--dark:#21130f;
--cream:#f5eadb;
--paper:#fffaf3;
--orange:#d86f45;
--gold:#e5aa68;
--muted:#8b7569;
}

body{
font-family:Arial,sans-serif;
background:var(--paper);
color:var(--dark);
padding-bottom:130px;
}

header{
padding:24px 20px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:28px;
font-weight:900;
}

.back{
text-decoration:none;
color:var(--dark);
border:1px solid #e0d0c2;
padding:10px 14px;
border-radius:30px;
}

.hero{
padding:25px 20px 30px;
}

.hero small{
color:var(--orange);
font-weight:bold;
}

.hero h1{
font-size:48px;
margin-top:7px;
}

.hero p{
color:var(--muted);
margin-top:9px;
line-height:1.7;
}

.cart-list{
padding:0 18px;
}

.item{
background:white;
border-radius:24px;
padding:12px;
margin-bottom:14px;
display:grid;
grid-template-columns:105px 1fr;
gap:14px;
box-shadow:0 8px 25px rgba(40,20,10,.06);
}

.item img{
width:105px;
height:130px;
object-fit:cover;
border-radius:17px;
}

.item h3{
font-size:18px;
margin:5px 0 7px;
}

.details{
color:var(--muted);
font-size:11px;
line-height:1.7;
}

.item-bottom{
display:flex;
align-items:center;
justify-content:space-between;
margin-top:10px;
}

.price{
font-weight:900;
}

.controls{
display:flex;
align-items:center;
gap:9px;
}

.controls button{
width:30px;
height:30px;
border:0;
border-radius:50%;
background:var(--dark);
color:white;
font-size:17px;
}

.delete{
border:0;
background:none;
color:#b14f39;
font-size:11px;
margin-top:9px;
cursor:pointer;
}

.empty{
text-align:center;
padding:65px 25px;
}

.empty .cup{
font-size:55px;
margin-bottom:15px;
}

.empty h2{
font-size:25px;
}

.empty p{
color:var(--muted);
margin:10px 0 25px;
}

.empty a{
display:inline-block;
background:var(--dark);
color:white;
padding:14px 24px;
border-radius:30px;
text-decoration:none;
}

.summary{
margin:30px 18px;
background:#f1dfcb;
border-radius:23px;
padding:20px;
}

.row{
display:flex;
justify-content:space-between;
margin-bottom:12px;
font-size:13px;
}

.total-row{
border-top:1px solid #d7c0aa;
padding-top:15px;
margin-top:5px;
font-size:20px;
font-weight:900;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
padding:14px 18px 22px;
background:rgba(255,250,243,.96);
backdrop-filter:blur(10px);
border-top:1px solid #eadccf;
}

.checkout{
display:flex;
justify-content:space-between;
align-items:center;
max-width:650px;
margin:auto;
background:var(--dark);
color:white;
text-decoration:none;
border-radius:18px;
padding:18px;
font-weight:bold;
}

.checkout span:last-child{
color:var(--gold);
}

@media(min-width:700px){
body{
max-width:700px;
margin:auto;
}

.bottom{
max-width:700px;
margin:auto;
}
}
</style>
</head>

<body>

<header>
<div class="logo">رَوق</div>
<a href="menu.html" class="back">+ أضف أكثر</a>
</header>

<section class="hero">
<small>YOUR ORDER / 03</small>
<h1>طلبك.</h1>
<p>راجع روقانك قبل ما نكمل بيانات الطلب.</p>
</section>

<div id="cartList" class="cart-list"></div>

<div id="summary" class="summary" style="display:none">

<div class="row">
<span>المجموع</span>
<span id="subtotal">0.000 ر.ع</span>
</div>

<div class="row">
<span>رسوم التوصيل</span>
<span>تُحدد لاحقًا</span>
</div>

<div class="row total-row">
<span>الإجمالي الحالي</span>
<span id="grandTotal">0.000 ر.ع</span>
</div>

</div>

<div class="bottom" id="bottomBar" style="display:none">
<a href="checkout.html" class="checkout">
<span>إتمام الطلب ←</span>
<span id="buttonTotal">0.000 ر.ع</span>
</a>
</div>

<script>

let cart = JSON.parse(localStorage.getItem("rawqCart")) || [];

function save(){
localStorage.setItem("rawqCart", JSON.stringify(cart));
render();
}

function render(){

const list = document.getElementById("cartList");
const summary = document.getElementById("summary");
const bottom = document.getElementById("bottomBar");

list.innerHTML = "";

if(cart.length === 0){

summary.style.display = "none";
bottom.style.display = "none";

list.innerHTML = `
<div class="empty">
<div class="cup">☕</div>
<h2>السلة فاضية</h2>
<p>واضح إن روقانك للحين ما اكتمل.</p>
<a href="menu.html">استكشف المنيو</a>
</div>
`;

return;
}

summary.style.display = "block";
bottom.style.display = "block";

let total = 0;

cart.forEach((item,index)=>{

total += Number(item.total);

let extrasText =
item.extras && item.extras.length
? item.extras.join(" • ")
: "بدون إضافات";

list.innerHTML += `
<div class="item">

<img src="${item.image}" alt="${item.name}">

<div>
<h3>${item.name}</h3>

<div class="details">
الحجم: ${item.size}<br>
الحليب: ${item.milk}<br>
${extrasText}
</div>

<div class="item-bottom">

<div class="price">
${Number(item.total).toFixed(3)} ر.ع
</div>

<div class="controls">
<button onclick="changeQty(${index},-1)">−</button>
<span>${item.quantity}</span>
<button onclick="changeQty(${index},1)">+</button>
</div>

</div>

<button class="delete" onclick="removeItem(${index})">
حذف من الطلب
</button>

</div>

</div>
`;
});

document.getElementById("subtotal").textContent =
total.toFixed(3) + " ر.ع";

document.getElementById("grandTotal").textContent =
total.toFixed(3) + " ر.ع";

document.getElementById("buttonTotal").textContent =
total.toFixed(3) + " ر.ع";
}

function changeQty(index,change){

const item = cart[index];

const oldQty = item.quantity;
const singlePrice = item.total / oldQty;

item.quantity += change;

if(item.quantity < 1){
item.quantity = 1;
}

item.total = singlePrice * item.quantity;

save();
}

function removeItem(index){

cart.splice(index,1);
save();
}

render();

</script>

</body>
</html>
