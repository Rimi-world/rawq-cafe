<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تم استلام الطلب | رَوْق</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, sans-serif;
min-height:100vh;
background:#F3EBDD;
color:#2D211B;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
}

.card{
width:100%;
max-width:520px;
background:#FFFDF9;
border-radius:30px;
padding:42px 25px;
text-align:center;
box-shadow:0 18px 50px rgba(70,45,30,.12);
}

.icon{
width:88px;
height:88px;
margin:0 auto 25px;
border-radius:50%;
background:#315C4B;
color:white;
display:flex;
align-items:center;
justify-content:center;

}

.brand{
color:#A66A3F;
font-size:14px;
letter-spacing:3px;
margin-bottom:12px;
}

h1{
font-size:30px;
margin-bottom:12px;
}

.message{
color:#75645A;
line-height:1.9;
font-size:16px;
margin-bottom:28px;
}

.order-box{
background:#F7F1E8;
border:1px solid #E8D9C7;
border-radius:20px;
padding:18px;
margin-bottom:25px;
}

.order-box span{
display:block;
color:#8A776B;
font-size:13px;
margin-bottom:7px;
}

.order-number{
font-size:21px;
font-weight:bold;
color:#315C4B;
}

.note{
font-size:14px;
line-height:1.8;
color:#75645A;
margin-bottom:28px;
}

.home{
display:block;
width:100%;
padding:16px;
border-radius:16px;
background:#2D211B;
color:white;
text-decoration:none;
font-weight:bold;
}

.home:hover{
opacity:.9;
}
</style>
</head>

<body>

<div class="card">

<div class="icon">✓</div>

<div class="brand">RAWQ CAFÉ</div>

<h1>تم استلام طلبك</h1>

<p class="message">
شكراً لاختيارك رَوْق ☕<br>
تم إرسال طلبك بنجاح وسيتم مراجعته وتجهيزه.
</p>

<div class="order-box">
<span>رقم الطلب</span>
<div class="order-number" id="orderNumber"></div>
</div>

<p class="note">
احتفظ برقم الطلب للرجوع إليه عند الحاجة.<br>
سيتم التواصل معك عند تأكيد الطلب.
</p>

<a class="home" href="index.html">
العودة للرئيسية
</a>

</div>

<script>
const number = "RQ-" + Math.floor(100000 + Math.random() * 900000);
document.getElementById("orderNumber").textContent = number;
</script>
<!-- RAWQ SUCCESS AUTO DEMO -->
<style>
#successDemo{
position:fixed;
inset:0;
z-index:99999;
pointer-events:none;
display:none;
}

.success-demo-text{
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%) translateY(20px);
background:rgba(33,19,15,.96);
color:#fffaf3;
padding:14px 24px;
border-radius:100px;
font-size:14px;
font-weight:800;
white-space:nowrap;
opacity:0;
transition:.5s ease;
box-shadow:0 10px 30px rgba(0,0,0,.20);
}

.success-demo-text.show{
opacity:1;
transform:translateX(-50%) translateY(0);
}

.demo-end{
position:fixed;
inset:0;
background:#21130f;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
opacity:0;
transition:.7s ease;
}

.demo-end.show{
opacity:1;
}

.demo-end-logo{
font-size:70px;
font-weight:900;
color:#fffaf3;
}

.demo-end-en{
color:#e5aa68;
font-size:10px;
letter-spacing:5px;
margin-top:10px;
}

.demo-end-line{
width:65px;
height:2px;
background:#d86f45;
margin:22px auto;
}

.demo-end-message{
color:#fffaf3;
font-size:18px;
font-weight:700;
}

.demo-end-small{
color:#a99488;
font-size:11px;
margin-top:10px;
}
</style>

<div id="successDemo">

<div
class="success-demo-text"
id="successDemoText">
</div>

<div class="demo-end" id="demoEnd">
<div>
<div class="demo-end-logo">رَوق</div>

<div class="demo-end-en">
RAWQ CAFÉ
</div>

<div class="demo-end-line"></div>

<div class="demo-end-message">
خذ وقتك. واروق.
</div>

<div class="demo-end-small">
YOUR COFFEE • YOUR MOOD
</div>
</div>
</div>

</div>

<script>
(function(){

const params =
new URLSearchParams(window.location.search);

if(params.get("demo") !== "1") return;

const layer =
document.getElementById("successDemo");

const text =
document.getElementById("successDemoText");

const end =
document.getElementById("demoEnd");

layer.style.display="block";

function wait(ms){
return new Promise(resolve =>
setTimeout(resolve,ms)
);
}

async function run(){

await wait(500);

text.textContent="تم استلام طلبك ✓";
text.classList.add("show");

await wait(1700);

text.classList.remove("show");

await wait(350);

end.classList.add("show");

}

run();

})();
</script>
</body>
</html>
