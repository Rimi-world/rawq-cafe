<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إتمام الطلب | رَوق</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--dark:#21130f;
--coffee:#563529;
--cream:#f5eadb;
--paper:#fffaf3;
--orange:#d86f45;
--gold:#e5aa68;
--muted:#8b7569;
--line:#eadccf;
}

body{
font-family:Arial,sans-serif;
background:var(--paper);
color:var(--dark);
padding-bottom:120px;
}

header{
padding:22px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:27px;
font-weight:900;
}

.back{
text-decoration:none;
color:var(--dark);
border:1px solid var(--line);
padding:10px 15px;
border-radius:30px;
}

.hero{
padding:25px 20px 30px;
}

.hero small{
color:var(--orange);
font-weight:bold;
}

.hero h1{
font-size:43px;
margin:7px 0;
}

.hero p{
color:var(--muted);
line-height:1.7;
}

.container{
padding:0 18px;
}

.card{
background:white;
border-radius:25px;
padding:20px;
margin-bottom:17px;
box-shadow:0 8px 25px rgba(40,20,10,.06);
}

.card h2{
font-size:20px;
margin-bottom:18px;
}

.field{
margin-bottom:17px;
}

.field label{
display:block;
font-size:12px;
font-weight:bold;
margin-bottom:8px;
}

.field input,
.field select,
.field textarea{
width:100%;
border:1px solid #e3d5c9;
background:#fffaf6;
padding:15px;
border-radius:15px;
font-size:14px;
outline:none;
color:var(--dark);
}

.field textarea{
min-height:90px;
resize:none;
}

.delivery-options{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.delivery{
position:relative;
}

.delivery input{
position:absolute;
opacity:0;
}

.delivery label{
display:block;
border:2px solid #eadccf;
padding:18px 10px;
border-radius:18px;
text-align:center;
cursor:pointer;
font-weight:bold;
}

.delivery input:checked + label{
border-color:var(--orange);
background:#fff1e9;
color:var(--orange);
}

.delivery label span{
display:block;
font-size:24px;
margin-bottom:7px;
}

#addressBox{
display:none;
margin-top:20px;
padding-top:20px;
border-top:1px solid var(--line);
}

.order-item{
display:flex;
gap:12px;
align-items:center;
margin-bottom:14px;
}

.order-item img{
width:65px;
height:65px;
object-fit:cover;
border-radius:14px;
}

.order-info{
flex:1;
}

.order-info strong{
display:block;
margin-bottom:5px;
}

.order-info small{
color:var(--muted);
}

.order-price{
font-weight:bold;
font-size:13px;
}

.total{
border-top:1px solid var(--line);
margin-top:15px;
padding-top:17px;
display:flex;
justify-content:space-between;
font-size:21px;
font-weight:900;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
padding:14px 18px 22px;
background:rgba(255,250,243,.96);
backdrop-filter:blur(10px);
border-top:1px solid var(--line);
z-index:30;
}

.next{
width:100%;
max-width:650px;
margin:auto;
display:flex;
justify-content:space-between;
border:0;
background:var(--dark);
color:white;
padding:18px;
border-radius:18px;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

.next span:last-child{
color:var(--gold);
}

.error{
display:none;
background:#ffe9e2;
color:#9a3e2d;
padding:12px;
border-radius:12px;
margin-bottom:15px;
font-size:12px;
}

@media(min-width:700px){
body{
max-width:700px;
margin:auto;
}
.bottom{
max-width:700px;
margin:auto;
}
}
</style>
</head>

<body>

<header>
<div class="logo">رَوق</div>
<a href="cart.html" class="back">رجوع</a>
</header>

<section class="hero">
<small>CHECKOUT / 04</small>
<h1>نكمل طلبك.</h1>
<p>دخل بياناتك واختار الطريقة اللي تناسبك.</p>
</section>

<div class="container">

<div id="error" class="error">
يرجى تعبئة البيانات المطلوبة.
</div>

<section class="card">
<h2>بياناتك</h2>

<div class="field">
<label>الاسم الكامل *</label>
<input id="name" type="text" placeholder="اكتب اسمك">
</div>

<div class="field">
<label>رقم الهاتف *</label>
<input id="phone" type="tel" inputmode="numeric"
placeholder="+968">
</div>

</section>


<section class="card">

<h2>كيف تستلم طلبك؟</h2>

<div class="delivery-options">

<div class="delivery">
<input type="radio" id="pickup" name="delivery"
value="pickup" checked onchange="deliveryChange()">
<label for="pickup">
<span>☕</span>
استلام من الكوفي
</label>
</div>

<div class="delivery">
<input type="radio" id="home" name="delivery"
value="delivery" onchange="deliveryChange()">
<label for="home">
<span>⌂</span>
توصيل
</label>
</div>

</div>


<div id="addressBox">

<div class="field">
<label>المحافظة *</label>
<select id="governorate">
<option value="">اختر المحافظة</option>
<option>مسقط</option>
<option>شمال الباطنة</option>
<option>جنوب الباطنة</option>
<option>الداخلية</option>
<option>شمال الشرقية</option>
<option>جنوب الشرقية</option>
<option>الظاهرة</option>
<option>البريمي</option>
<option>مسندم</option>
<option>الوسطى</option>
<option>ظفار</option>
</select>
</div>

<div class="field">
<label>الولاية *</label>
<input id="wilayat" type="text" placeholder="مثال: بوشر">
</div>

<div class="field">
<label>تفاصيل الموقع *</label>
<textarea id="address"
placeholder="المنطقة، الشارع، رقم المنزل أو أقرب معلم..."></textarea>
</div>

</div>

</section>


<section class="card">

<h2>ملاحظات للطلب</h2>

<div class="field">
<textarea id="notes"
placeholder="مثلاً: بدون سكر، الاتصال عند الوصول..."></textarea>
</div>

</section>


<section class="card">

<h2>ملخص طلبك</h2>

<div id="orderSummary"></div>

<div class="total">
<span>الإجمالي</span>
<span id="total">0.000 ر.ع</span>
</div>

</section>

</div>


<div class="bottom">

<button class="next" onclick="continueOrder()">
<span>متابعة للدفع ←</span>
<span id="bottomTotal">0.000 ر.ع</span>
</button>

</div>


<script>

const cart =
JSON.parse(localStorage.getItem("rawqCart")) || [];

let total = 0;

function renderSummary(){

const box =
document.getElementById("orderSummary");

box.innerHTML="";

total=0;

cart.forEach(item=>{

total += Number(item.total);

box.innerHTML += `
<div class="order-item">

<img src="${item.image}" alt="${item.name}">

<div class="order-info">
<strong>${item.name}</strong>
<small>الكمية: ${item.quantity}</small>
</div>

<div class="order-price">
${Number(item.total).toFixed(3)} ر.ع
</div>

</div>
`;
});

document.getElementById("total").textContent =
total.toFixed(3)+" ر.ع";

document.getElementById("bottomTotal").textContent =
total.toFixed(3)+" ر.ع";
}


function deliveryChange(){

const selected =
document.querySelector(
'input[name="delivery"]:checked'
).value;

document.getElementById("addressBox").style.display =
selected==="delivery" ? "block" : "none";
}


function continueOrder(){

const name =
document.getElementById("name").value.trim();

const phone =
document.getElementById("phone").value.trim();

const delivery =
document.querySelector(
'input[name="delivery"]:checked'
).value;

const error =
document.getElementById("error");

if(!name || !phone){
error.style.display="block";
window.scrollTo({top:0,behavior:"smooth"});
return;
}

let governorate="";
let wilayat="";
let address="";

if(delivery==="delivery"){

governorate =
document.getElementById("governorate").value;

wilayat =
document.getElementById("wilayat").value.trim();

address =
document.getElementById("address").value.trim();

if(!governorate || !wilayat || !address){
error.style.display="block";
return;
}
}

error.style.display="none";

const orderData={
name:name,
phone:phone,
delivery:delivery,
governorate:governorate,
wilayat:wilayat,
address:address,
notes:document.getElementById("notes").value,
total:total
};

localStorage.setItem(
"rawqOrder",
JSON.stringify(orderData)
);

window.location.href="payment.html";
}

renderSummary();
deliveryChange();

</script>
<!-- RAWQ CHECKOUT AUTO DEMO -->
<style>
#checkoutDemo{
position:fixed;
inset:0;
z-index:99999;
pointer-events:none;
display:none;
}

.checkout-demo-text{
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%) translateY(15px);
background:rgba(33,19,15,.96);
color:#fffaf3;
padding:13px 22px;
border-radius:100px;
font-size:13px;
font-weight:800;
white-space:nowrap;
opacity:0;
transition:.3s ease;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.checkout-demo-text.show{
opacity:1;
transform:translateX(-50%) translateY(0);
}

.checkout-demo-pointer{
position:fixed;
width:42px;
height:42px;
border-radius:50%;
background:#d86f45;
border:4px solid white;
box-shadow:0 8px 25px rgba(0,0,0,.25);
opacity:0;
transform:scale(.5);
transition:
left .55s ease,
top .55s ease,
opacity .25s,
transform .18s;
}

.checkout-demo-pointer.show{
opacity:1;
transform:scale(1);
}

.checkout-demo-pointer.click{
transform:scale(.68);
}

.checkout-demo-pointer::after{
content:"";
position:absolute;
inset:-9px;
border:2px solid rgba(216,111,69,.45);
border-radius:50%;
animation:checkoutPulse 1s infinite;
}

@keyframes checkoutPulse{
from{
transform:scale(.7);
opacity:1;
}
to{
transform:scale(1.5);
opacity:0;
}
}
</style>

<div id="checkoutDemo">
<div
class="checkout-demo-pointer"
id="checkoutDemoPointer">
</div>

<div
class="checkout-demo-text"
id="checkoutDemoText">
</div>
</div>

<script>
(function(){

const params =
new URLSearchParams(window.location.search);

if(params.get("demo") !== "1") return;

const layer =
document.getElementById("checkoutDemo");

const pointer =
document.getElementById("checkoutDemoPointer");

const text =
document.getElementById("checkoutDemoText");

layer.style.display="block";

const wait = ms =>
new Promise(resolve => setTimeout(resolve,ms));


function say(message){
text.textContent=message;
text.classList.add("show");
}


function pointTo(element){

if(!element) return;

element.scrollIntoView({
behavior:"smooth",
block:"center"
});

setTimeout(()=>{

const r=element.getBoundingClientRect();

pointer.style.left=
(r.left+r.width/2-21)+"px";

pointer.style.top=
(r.top+r.height/2-21)+"px";

pointer.classList.add("show");

},350);
}


async function tap(element){

if(!element) return;

pointTo(element);

await wait(650);

pointer.classList.add("click");

await wait(160);

pointer.classList.remove("click");
}


async function typeText(input,value){

if(!input) return;

pointTo(input);

await wait(450);

input.focus();

input.value="";

for(const letter of value){

input.value += letter;

input.dispatchEvent(
new Event("input",{bubbles:true})
);

await wait(45);
}
}


async function run(){

await wait(500);

/* الاسم */

say("أدخل بيانات الاستلام");

const name =
document.getElementById("name");

await typeText(name,"زبون رَوق");

await wait(250);


/* الهاتف */

const phone =
document.getElementById("phone");

await typeText(phone,"90000000");

await wait(400);


/* طريقة الاستلام */

say("ثم اختر طريقة استلام طلبك");

const pickup =
document.getElementById("pickup");

if(pickup){

const pickupLabel =
document.querySelector(
'label[for="pickup"]'
) || pickup;

await tap(pickupLabel);

pickup.checked=true;

pickup.dispatchEvent(
new Event("change",{bubbles:true})
);
}

await wait(700);


/* ملاحظات */

const notes =
document.getElementById("notes");

if(notes){

say("وأضف ملاحظتك إذا احتجت");

await typeText(
notes,
"بدون سكر"
);

await wait(500);
}


/* متابعة للدفع */

say("جاهز؟ نكمل للدفع");

const nextButton =
document.querySelector(".next");

if(nextButton){

pointTo(nextButton);

await wait(800);

pointer.classList.add("click");

await wait(160);

pointer.classList.remove("click");
}


/*
نحفظ بيانات تجريبية
ونكمل العرض
*/

const cart =
JSON.parse(
localStorage.getItem("rawqCart")
) || [];

let total=0;

cart.forEach(item=>{
total += Number(item.total);
});

localStorage.setItem(
"rawqOrder",
JSON.stringify({
name:"زبون رَوق",
phone:"90000000",
delivery:"pickup",
governorate:"",
wilayat:"",
address:"",
notes:"بدون سكر",
total:total
})
);

await wait(250);

window.location.href=
"payment.html?demo=1";
}

run();

})();
</script>
</body>
</html>
