<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رَوق | RAWQ Café</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family: Arial, sans-serif;
background:#F2E5D5;
color:#2A1710;
min-height:100vh;
}

.hero{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:space-between;
padding:28px 24px 38px;
background:
radial-gradient(circle at 15% 15%, #D7774F 0 9%, transparent 10%),
radial-gradient(circle at 92% 80%, #B95838 0 15%, transparent 16%),
#F2E5D5;
overflow:hidden;
}

nav{
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:30px;
font-weight:900;
letter-spacing:-2px;
}

.logo small{
display:block;
font-size:9px;
letter-spacing:4px;
font-weight:600;
margin-top:2px;
}

.menu-icon{
width:46px;
height:46px;
background:#2A1710;
color:#F2E5D5;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
}

.content{
max-width:650px;
}

.tag{
display:inline-block;
border:1px solid #2A1710;
border-radius:50px;
padding:9px 17px;
font-size:12px;
margin-bottom:24px;
}

h1{
font-size:clamp(55px,14vw,115px);
line-height:.9;
letter-spacing:-5px;
margin-bottom:25px;
}

h1 span{
color:#B95838;
}

.description{
font-size:17px;
line-height:1.9;
max-width:430px;
margin-bottom:30px;
}

.start{
display:inline-flex;
align-items:center;
gap:20px;
background:#2A1710;
color:#fff;
text-decoration:none;
padding:18px 25px;
border-radius:60px;
font-size:16px;
font-weight:bold;
}

.start span{
width:35px;
height:35px;
background:#D7774F;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}

.bottom{
display:flex;
justify-content:space-between;
align-items:end;
border-top:1px solid rgba(42,23,16,.25);
padding-top:18px;
font-size:11px;
letter-spacing:1px;
}

.number{
font-size:42px;
font-weight:900;
color:#B95838;
}

@media(max-width:600px){
.hero{
min-height:100svh;
}

h1{
font-size:74px;
}
}
</style>
</head>

<body>

<section class="hero">

<nav>
<div class="logo">
رَوق
<small>RAWQ CAFÉ</small>
</div>

<div class="menu-icon">☕</div>
</nav>

<div class="content">

<div class="tag">قهوة • مزاج • رَوقان</div>

<h1>
خُذ وقتك.<br>
<span>واروق.</span>
</h1>

<p class="description">
مو كل قهوة تنشرب على عَجل.
اختر مزاجك، خصّص كوبك، وخلي الباقي علينا.
</p>

<a class="start" href="menu.html">
ابدأ روقانك
<span>←</span>
</a>

</div>

<div class="bottom">
<div>
RAWQ<br>
COFFEE EXPERIENCE
</div>

<div class="number">01</div>
</div>

</section>

</body>
</html>
